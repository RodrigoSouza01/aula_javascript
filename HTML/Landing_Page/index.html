<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Buy</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js"></script>

</head>

<body>

    <header class="header vertical-header">
        <h1>Check<span style="color: #05ae0f;">Buy</span></h1>
        <p>Welcome to Check Buy, your one-stop solution for all your shopping needs!</p>
        <nav>
        </nav>
    </header>

    <nav class="sidebar">
        <div class="sidebar-top-wrapper">
            <div class="sidebar-top">
                <a href="#" class="logo_wrapper">
                    <img src="assets/astra.svg" alt="Logo" class="logo-small">
                    <span class="hide">Astra</span>
                </a>
            </div>
            <div class="expand-btn"><!-- expand btn --></div>
        </div>

        <div class="search_wrapper">
            <!-- svg search -->
            <input type="search" placeholder="Search for anything...">
        </div>

        <div class="sidebar-links">
            <h2>Main</h2>
            <ul>
                <li>
                    <a href="#dashboard" title="Dashboard" class="tooltip">
                        <!-- svg -->
                        <span class="link hide">Dashboard</span>
                        <span class="tooltip__content">Dashboard</span>
                    </a>
                </li>
            </ul>
        </div>

        <div class="sidebar-links bottom-links">
            <h2>Settings</h2>
            <ul>
                <li>
                    <a href="#settings" title="Settings" class="tooltip">
                        <!-- svg -->
                        <span class="link hide">Settings</span>
                        <span class="tooltip__content">Settings</span>
                    </a>
                </li>
            </ul>
        </div>

        <div class="divider"></div>

        <div class="sidebar__profile">
            <div class="avatar_wrapper">
                <img class="avatar" src="assets/profile.png" alt="Joe Doe Picture">
                <div class="online_status"></div>
            </div>
            <section class="avatar_name hide">
                <div class="user-name">Joe Doe</div>
                <div class="email">joe.doe@atheros.ai</div>
            </section>
            <a href="#logout" class="logout">
                <!-- logout -->
            </a>
        </div>
    </nav>

</body>

</html>
